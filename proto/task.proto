syntax = "proto3";

package task_Manager;
option go_package = "github.com/Sourav-126/distributed-task-manager/pb/task";

service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  rpc GetTaskById(GetTaskByIdRequest) returns (GetTaskByIdResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  rpc CreateBulkTask(CreateBulkTaskRequest) returns (CreateBulkTaskResponse);
  rpc ListAllTasks(ListAllTasksRequest) returns (ListAllTasksResponse);
}

message CreateTaskRequest {
  Task task = 1;
}

message CreateTaskResponse {
  Response response = 1;
  string task_id = 2;
}

message UpdateTaskRequest {
  Task task = 1;
}

message UpdateTaskResponse {
  Response resp = 1;
}

message GetTaskByIdRequest {
  int32 taskID = 1;
}

message GetTaskByIdResponse {
  Task task = 1;
}

message DeleteTaskRequest {
  int32 taskID = 1;
}

message DeleteTaskResponse {
  Response resp = 1;
}

message ListAllTasksRequest {
}

message ListAllTasksResponse {
  repeated Task tasks = 1;
}

message CreateBulkTaskRequest {
  repeated Task tasks = 1;
}

message CreateBulkTaskResponse {
  Response resp = 1;
  int32 count = 2;
}

message Response {
  bool success = 1;
  string message = 2;
}

message Task {
  string id = 1;
  string title = 2;
  string description = 3;
  Priority priority = 4;
  optional Difficulty difficulty = 5;
}

enum Priority{
    LOW=0;
    MEDIUM=1;
    HIGH=3;
}

enum Difficulty{
    NAHI_HAI_MUSHKIL=0;
    LAG_TO_MUSHKIL_RHA_HAI=1;
    MUSHKIL_HAI=2;
    TUM_PE_NAHOGA=3;
    HUM_NA_PATO=4;
}

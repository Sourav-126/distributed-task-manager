root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./dist/main ./src"
  bin = "dist/main"
  entrypoint = "./dist/main"

  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["assets", "dist", "vendor", "testdata"]
  exclude_regex = ["_test.go"]

  delay = 1000
  log = "build-errors.log"

[build.windows]
  cmd = "go build -o ./dist/main.exe ./src"
  bin = "dist/main.exe"
  entrypoint = "./dist/main.exe"

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"
